<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div  class="container">
        <h1>CV Generator</h1>
        <form method="POST">
            {% csrf_token %}
            
            <label>Name</label>
            <input type="text"class="form-control" name="name"></input>
            <label>Email</label>
            <input type="email"class="form-control" name="email"></input>
            <label>About</label>
            <input type="text"class="form-control" name="about"></input>
            <label>Mobile</label>
            <input type="text"class="form-control" name="mobile"></input>
            <label>Degree</label>
            <input type="text"class="form-control" name="degree"></input>
            <label>University</label>
            <input type="text"class="form-control" name="university"></input>
            <label>School</label>
            <input type="text"class="form-control" name="school"></input>
            <label>Previous Work</label>
            <input type="text"class="form-control" name="previous_work"></input>
            <label>Skills</label>
            <input type="text"class="form-control" name="skills"></input>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
